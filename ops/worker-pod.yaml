# OXO worker pod for own XEarthLayer packages — this host's real paths.
# Generic template and mount-point contract: deploy/worker-pod.yaml, worker/README.md.
# Runbook: ops/README.md. Several workers: copy this file and change BOTH
# metadata.name and the scratch volume name (scratch-1 -> scratch-2, ...).
#
#   podman kube play ops/worker-pod.yaml
#   podman kube down ops/worker-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: oxo-worker-1
  labels:
    app: oxo-worker
spec:
  restartPolicy: Always
  containers:
    - name: worker
      image: localhost/oxo-worker:dev
      imagePullPolicy: Never
      env:
        # oxo-controld on this host, bound to 0.0.0.0:8080 (ops/README.md).
        - name: OXO_CONTROL_URL
          value: "http://host.containers.internal:8080"
        - name: OXO_MODE
          value: "recycle"
        # deploy/worker-pod.yaml's production values. No overpass_server_choice:
        # a fixed server is used for every retry; stock "random" fails over
        # between the servers listed in ops/o4-overlay/overpass_servers.txt.
        - name: OXO_O4_CONFIG_OVERLAY
          value: "/var/oxo/o4-overlay"
        - name: OXO_O4_APP_OVERRIDES
          value: '{"max_download_slots":"2","max_convert_slots":"8","http_timeout":"10.0","max_connect_retries":"5","max_baddata_retries":"5","ovl_exclude_pol":"[0]","ovl_exclude_net":"[]"}'
        # OXO_MIN_FREE_SCRATCH_BYTES stays at its 8 GiB default: a ZL16 floor,
        # matching our ZL16 production. Raise it if a package group goes above ZL16.
      resources:
        requests:
          memory: "6Gi"
        limits:
          memory: "8Gi"
      volumeMounts:
        - name: scratch-1
          mountPath: /var/oxo/scratch
        # Sonny DEMs, read-only: a tile without coverage fails instead of
        # building on downloaded data.
        - name: dem-cache
          mountPath: /var/oxo/dem
          readOnly: true
        - name: content
          mountPath: /var/oxo/content
          readOnly: true
        - name: patches
          mountPath: /var/oxo/patches-active
          readOnly: true
        - name: o4-overlay
          mountPath: /var/oxo/o4-overlay
          readOnly: true
        # Same path as on the host, so a spec's target.root is valid for the
        # worker and for ops/bin/oxo-package alike.
        - name: artifacts
          mountPath: /mnt/xplane_data/oxo/artifacts
  volumes:
    # Unique per pod: podman kube play turns an emptyDir into a *named* volume,
    # shared by every pod that uses the same name — and each worker's cleanup
    # then wipes the other's build (seen 2026-10-23, pilot +48+012).
    - name: scratch-1
      emptyDir: {}
    - name: dem-cache
      hostPath:
        path: /mnt/xplane_data/oxo/dem
        type: Directory
    # Empty: own packages carry no overlays, so no X-Plane scenery is needed.
    - name: content
      hostPath:
        path: /mnt/xplane_data/oxo/content
        type: Directory
    - name: patches
      hostPath:
        path: /home/maechtel/Work/Git/x-plane/ortho4-xearthlayer-orchestrator/ops/patches
        type: Directory
    # Install-root .txt files copied over the image's at worker start.
    - name: o4-overlay
      hostPath:
        path: /home/maechtel/Work/Git/x-plane/ortho4-xearthlayer-orchestrator/ops/o4-overlay
        type: Directory
    - name: artifacts
      hostPath:
        path: /mnt/xplane_data/oxo/artifacts
        type: Directory
