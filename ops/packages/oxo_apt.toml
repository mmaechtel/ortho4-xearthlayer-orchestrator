# Top tier (plan D8): only tiles with build patches in ops/patches/ — the airports whose
# scenery needs them. Outranks every legacy A0_* airport package.
#   ops/bin/oxo-compose ops/packages/oxo_apt.toml --legacy
#   ops/bin/oxo-compose ops/packages/oxo_apt.toml --group <ID> --submit http://127.0.0.1:8080
#   ops/bin/oxo-package ops/packages/oxo_apt.toml --code A00_OXO --no-mask-merge  (D10, operator 2026-10-24)

[metadata]
name = "oxo_apt"           # -> zzXEL_oxo_apt_ortho
region_code = "OXO-APT"    # each group becomes OXO-APT-<ID>
revision = 3          # r3: WSSS and RCSP after the DEM fix (#25); r2 groups keep their jobs

[target]
root = "/mnt/xplane_data/oxo/artifacts/oxo_apt"

# Vendor tile (plan D12): a finished Ortho4XP tile shipped with an add-on, packaged by
# oxo-package only (oxo-compose ignores it). Its .dds stay behind, so XEL streams the imagery
# and lights it at night; its mesh and airport flattening are kept as the vendor made them.
# Disable the add-on's own zOrtho4XP_* in Custom Scenery and any XEL patch for the tile.
[[vendor]]
tile = "+49+006"
src = "/mnt/xplane_data/Scenery/JustSim/zOrtho4XP_ELLX_+49+006"
source = "JustSim ELLX XPL12 v1.0"

# Corsica: FSX3D's tiles, kept by the operator after a test flight 2026-10-24. They replace our
# lfkj/lfkc groups (LFKJ/LFKC patches stay in ops/patches); their queued r2 jobs still deliver,
# and oxo-package skips those copies while these entries are listed.
[[vendor]]
