# Top tier (plan D8): only tiles with build patches in ops/patches/ — the airports whose
# scenery needs them. Outranks every legacy A0_* airport package.
#   ops/bin/oxo-compose ops/packages/oxo_apt.toml --legacy
#   ops/bin/oxo-compose ops/packages/oxo_apt.toml --group <ID> --submit http://127.0.0.1:8080
#   ops/bin/oxo-package ops/packages/oxo_apt.toml --code A00_OXO

[metadata]
name = "oxo_apt"           # -> zzXEL_oxo_apt_ortho
region_code = "OXO-APT"    # each group becomes OXO-APT-<ID>
revision = 1

[target]
root = "/mnt/xplane_data/oxo/artifacts/oxo_apt"

[[group]]
id = "eddm"
tiles = ["+48+011"]

# Keep-or-default, decided 2026-10-23 by the operator: samsoir everywhere (plan D4).
[group.legacy]
road_level = "default: samsoir baseline (D4)"
lane_width = "default: samsoir baseline (D4)"
max_levelled_segs = "default: samsoir baseline (D4)"
clean_bad_geometries = "default: samsoir baseline (D4)"
mesh_zl = "default: samsoir baseline (D4)"
masks_width = "default: samsoir baseline (D4)"
masking_mode = "default: samsoir baseline (D4)"
distance_masks_too = "default: samsoir baseline (D4)"
cover_extent = "default: samsoir baseline (D4)"
ratio_bathy = "default: samsoir baseline (D4)"
ratio_water = "default: samsoir baseline (D4)"
use_decal_on_terrain = "default: samsoir baseline (D4)"
