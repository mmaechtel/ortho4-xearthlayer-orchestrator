# M2 pilot: three tiles that also exist in the legacy zzXEL_eu_sonny_ortho, for comparison.
#   ops/bin/oxo-compose ops/packages/oxo_pilot.toml --submit http://127.0.0.1:8080
#   ops/bin/oxo-package ops/packages/oxo_pilot.toml --code A4_PILOT

[metadata]
name = "oxo_pilot"         # -> zzXEL_oxo_pilot_ortho
region_code = "EU-PILOT"   # job identity with revision; bump revision to rebuild
revision = 1

[target]
root = "/mnt/xplane_data/oxo/artifacts/oxo_pilot"

[[group]]
tiles = ["+48+010", "+48+011", "+48+012"]

# Per-group overrides go into further groups, e.g.:
# [[group]]
# id = "sand"
# tiles = ["+44+008"]
# raw = { masking_mode = "sand", masks_width = "25" }
