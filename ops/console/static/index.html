<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OXO Console</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="band">
<div class="top">
  <header id="status">
    <b>OXO</b><span class="dbdot" id="db" title="Datenbank"></span>
    <span id="summary">lade …</span><span id="msg"></span>
    <span id="ago"></span><span id="clock"></span>
  </header>
  <nav class="tabs" role="tablist" aria-label="Ansicht">
    <button type="button" role="tab" id="tab-band" data-tab="band" aria-controls="band-view">Band</button>
    <button type="button" role="tab" id="tab-map" data-tab="map" aria-controls="map-view">Karte</button>
  </nav>
</div>
<main id="main">
  <section id="band-view" role="tabpanel" aria-labelledby="tab-band">
    <div class="band" aria-label="Fliessband">
      <div class="col q"><h2 class="chead">QUEUE <span class="n" id="nq">0</span></h2>
        <div id="q"></div><button type="button" class="more" id="mq" data-more="q" aria-controls="q" hidden></button>
        <p class="empty" id="eq">Keine wartenden Tiles.</p></div>
      <div class="col l"><h2 class="chead">WORKER <span class="n" id="nl">0</span></h2>
        <div id="lanes"></div><p class="empty" id="el">Kein Worker-Container gefunden.</p></div>
      <div class="col d"><h2 class="chead">DELIVERED <span class="n" id="nd">0</span></h2>
        <div id="d"></div><button type="button" class="more" id="md" data-more="d" aria-controls="d" hidden></button>
        <p class="empty" id="ed">Alles Gelieferte ist paketiert.</p></div>
      <div class="col p"><h2 class="chead">PACKAGED <span class="n" id="np">0</span></h2>
        <div id="p"></div><button type="button" class="more" id="mp" data-more="p" aria-controls="p" hidden></button>
        <p class="empty" id="ep">Noch kein OXO-Tile installiert.</p></div>
    </div>
    <details class="allpk"><summary>ALLE PAKETE <span id="npk"></span></summary><ol id="allpk"></ol></details>
    <details class="scrap" id="scrapbox"><summary>AUSSCHUSS <span id="ns">0</span></summary><div id="scrap"></div></details>
    <h2 class="jhead">JOBS</h2>
    <div id="jobs"></div>
    <button type="button" class="more" id="mjobs" data-more="jobs" aria-controls="jobs" hidden></button>
  </section>
  <section id="detail" aria-label="Auswahl"></section>
  <section id="map-view" role="tabpanel" aria-labelledby="tab-map">
    <div id="map" aria-label="Karte der Tiles"></div>
  </section>
  <div id="live" class="sr" aria-live="polite"></div>
</main>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
