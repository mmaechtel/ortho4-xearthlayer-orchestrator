<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OXO Kachel-Glut</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  color-scheme: dark;
  --bg: #0a0d12; --panel: #10141b; --panel-2: #171c25; --line: #222a35;
  --text: #e7eaf0; --muted: #8d97a6; --faint: #5d6776;
  --pend: #7d8794; --pend-fill: #262d37; --pend-line: #465060;
  --glow: #ffb43c; --glow-hi: #ffe2a0; --glow-shadow: rgba(255, 166, 48, .6); --on-glow: #2a1600;
  --ok: #35b07a; --amber: #d18a2c; --bad: #e0524a; --bad-fill: #4a1d1f;
  --flash: #eaf4ff; --grid: #253040; --job: #a3b4ca; --label-bg: rgba(10, 13, 18, .78);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f2f2f0; --panel: #ffffff; --panel-2: #f5f6f8; --line: #dde1e6;
    --text: #1b2230; --muted: #5a6474; --faint: #8a93a1;
    --pend: #8a94a2; --pend-fill: #dfe3e8; --pend-line: #b3bac4;
    --glow: #f7a21b; --glow-hi: #a85500; --glow-shadow: rgba(242, 140, 18, .45); --on-glow: #2a1600;
    --ok: #1e8a5a; --amber: #b0700f; --bad: #c43c35; --bad-fill: #f4d6d4;
    --flash: #1b2230; --grid: #d3d8de; --job: #44546a; --label-bg: rgba(255, 255, 255, .85);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr; height: 100dvh; overflow: hidden;
}
button { font: inherit; color: inherit; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-weight: 800; letter-spacing: .12em; }
.db { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.db.down { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent); }
#sum { font-variant-numeric: tabular-nums; }
.ago { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5em; }
.spacer { flex: 1; }
.toggle { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.toggle[aria-pressed="true"] { border-color: var(--glow); color: var(--glow-hi); }
.mock { font: 600 10px/1 var(--mono); letter-spacing: .08em; color: var(--faint); border: 1px dashed var(--faint); border-radius: 4px; padding: 4px 6px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
#map { min-height: 0; background: var(--bg); }
.leaflet-container { background: var(--bg); font: inherit; }
.nomap { padding: 24px 16px; color: var(--muted); }

/* side panel / bottom sheet */
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 4px 16px 16px; }
aside h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; font-weight: 700; }
aside ul { list-style: none; margin: 0; padding: 0; }
.tabs { display: none; }
.empty { color: var(--faint); font-size: 13px; margin: 0; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }

.alarm { display: grid; grid-template-columns: 10px 1fr; gap: 2px 8px; padding: 8px 10px; margin-bottom: 6px; border-radius: 8px; background: var(--panel-2); border-left: 3px solid var(--amber); font-size: 13px; }
.alarm.bad { border-left-color: var(--bad); }
.alarm .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); margin-top: 5px; }
.alarm.bad .dot { background: var(--bad); }
.alarm b { font-weight: 650; }
.alarm .txt { grid-column: 2; color: var(--muted); overflow-wrap: anywhere; }
.alarm.enter { animation: slidein .5s cubic-bezier(.2, .7, .2, 1); }
@keyframes slidein { from { transform: translateX(30px); opacity: 0; background: color-mix(in srgb, var(--bad) 25%, var(--panel-2)); } }

.worker { padding: 10px 12px; margin-bottom: 6px; border-radius: 8px; background: var(--panel-2); cursor: pointer; display: grid; gap: 4px; }
.worker .r { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.wid { font: 700 11px/1 var(--mono); background: var(--glow); color: var(--on-glow); border-radius: 4px; padding: 3px 5px; }
.worker.idle .wid { background: var(--line); color: var(--muted); }
.wname { color: var(--muted); font-size: 12px; flex: 1; }
.hb { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.hb.stale { color: var(--amber); font-weight: 700; }
.wtile { font: 600 13px var(--mono); }
.wstep { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wclock { font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.wclock.over { color: var(--amber); }
.segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
.segs i { height: 4px; border-radius: 2px; background: var(--line); }
.segs i.done { background: var(--glow); }
.segs i.act { background: linear-gradient(90deg, var(--glow-hi) var(--f, 0%), var(--line) var(--f, 0%)); }
.log { font: 11px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.job { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 8px; padding: 8px 10px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; }
.job:hover { background: var(--panel-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 9px 2px 6px; font: 600 12px var(--mono); cursor: pointer; white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--job); }
.chip[aria-pressed="false"] { color: var(--faint); text-decoration: line-through; }
.chip[aria-pressed="false"]::before { background: transparent; box-shadow: inset 0 0 0 1px var(--faint); }
.jcnt { font: 12px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.jst { font-size: 11px; color: var(--muted); }
.jst.in_progress { color: var(--glow-hi); } .jst.failed { color: var(--bad); } .jst.complete { color: var(--ok); }
.bar { grid-column: 1 / -1; display: flex; gap: 1px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); }
.bar i { flex: 0 1 0; transition: flex-grow .6s ease-out; }
.b-ok { background: var(--ok); } .b-cl { background: var(--glow); } .b-pe { background: var(--pend); } .b-ab { background: var(--bad); }
.pkg { font-size: 12px; color: var(--muted); margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
.pkg b { color: var(--text); font-weight: 600; }

#detail { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.dhead { display: flex; align-items: center; gap: 8px; }
.dhead b { font: 700 16px var(--mono); flex: 1; }
.x { border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--muted); padding: 0 4px; }
.dent { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.dent .r { display: flex; align-items: center; gap: 8px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 6px 0 0; font-size: 12px; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; font-family: var(--mono); }

/* swatches (legend, tooltip, detail) */
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; }
.s-pending { background: repeating-linear-gradient(135deg, var(--pend-fill) 0 3px, var(--pend-line) 3px 4.5px); box-shadow: inset 0 0 0 1px var(--pend-line); }
.s-claimed { background: var(--glow); box-shadow: 0 0 8px var(--glow-shadow); }
.s-retry { background: color-mix(in srgb, var(--amber) 45%, transparent); box-shadow: inset 0 0 0 1.5px var(--amber); }
.s-succeeded { background: color-mix(in srgb, var(--ok) 60%, transparent); box-shadow: inset 0 0 0 1px var(--ok); }
.s-abandoned { background: repeating-linear-gradient(135deg, var(--bad-fill) 0 3px, var(--bad) 3px 4.5px); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 260px; padding: 8px 10px; border-radius: 8px; background: var(--label-bg); border: 1px solid var(--line); font-size: 11px; color: var(--muted); backdrop-filter: blur(4px); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.tip b { font-family: var(--mono); }
.tip .r { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.leaflet-tooltip { background: var(--panel); color: var(--text); border-color: var(--line); }

/* map layers */
.leaflet-grid-pane { opacity: .45; }
.nobase .leaflet-grid-pane { opacity: 1; }
.leaflet-glow-pane > svg, .leaflet-jobs-pane > svg { pointer-events: none; }
.leaflet-glow-pane > svg { filter: drop-shadow(0 0 10px var(--glow-shadow)); }
path.glow { fill: var(--glow); stroke: var(--glow-hi); stroke-width: 1.5; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { fill-opacity: .55; } 50% { fill-opacity: .85; } }
path.glow.stale { animation: none; fill: var(--amber); stroke: var(--amber); fill-opacity: .6; }
path.job-outline { stroke: var(--job); stroke-opacity: .45; }
path.job-outline.active { stroke-opacity: .95; }

.deco-icon, .flash-icon, .cs-icon, .label-icon, .donut-icon { pointer-events: none; }
.deco { position: relative; width: 100%; height: 100%; }
.wave { position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2); border-radius: 50%; opacity: 0; }
.ping { border: 3px solid var(--glow-hi); }
.rip { border: 1.5px solid var(--glow-hi); }
.ring { position: absolute; left: 50%; top: 50%; width: var(--r); height: var(--r); transform: translate(-50%, -50%); overflow: visible; display: none; }
.deco.claimed .ring { display: block; }
.ring path { fill: none; }
.ring .trk { stroke: rgba(30, 16, 0, .38); stroke-width: 8; }
.ring .trk.act { stroke: rgba(30, 16, 0, .55); }
.ring .fil { stroke: #fff6e0; stroke-width: 8; stroke-dasharray: 1; opacity: 0; }
.ring .fil.done { opacity: 1; }
.ring .prog { stroke: #fff; stroke-width: 2.5; stroke-linecap: round; }
.ring .prog.over { stroke: var(--amber); stroke-width: 3.5; }
.ring text { fill: var(--on-glow); font: 800 19px var(--mono); text-anchor: middle; dominant-baseline: central; }
.deco.stale .ring .fil { stroke: #f3e2c4; }
.deco.small .ring, .deco.small .raw { display: none !important; }
.badge, .neu { position: absolute; top: 4px; font: 700 11px/1 var(--mono); padding: 3px 6px; border-radius: 9px; }
.badge { right: 4px; background: var(--amber); color: #1a1000; }
.neu { left: 4px; background: var(--flash); color: var(--bg); }
.badge:empty, .neu:empty, .raw:empty { display: none; }
.raw { position: absolute; left: 4px; right: 4px; bottom: 4px; font: 10px var(--mono); color: var(--on-glow); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.flash { position: relative; width: 100%; height: 100%; }
.flash.cool { animation: cool 1.2s ease-out both; }
@keyframes cool { from { background: color-mix(in srgb, var(--glow) 85%, transparent); box-shadow: 0 0 24px var(--glow-shadow); } to { background: transparent; box-shadow: none; } }
.flash.cool::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--ok) 42%, transparent); box-shadow: inset 0 0 0 1px var(--ok); animation: fillup 1.2s cubic-bezier(.5, 0, .3, 1) both; }
@keyframes fillup { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
.check { position: absolute; left: 50%; top: 50%; z-index: 1; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: var(--ok); color: #fff; font: 800 20px/34px system-ui; text-align: center; animation: pop 1.2s ease-out both; }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 25% { transform: scale(1.1); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { opacity: 0; } }
.flash.shake { background: color-mix(in srgb, var(--amber) 40%, transparent); box-shadow: inset 0 0 0 1.5px var(--amber); animation: shake .3s linear both; }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.flash.contour { box-shadow: inset 0 0 0 2px var(--flash), 0 0 14px var(--flash); animation: fade 1.4s ease-out both; }
@keyframes fade { from { opacity: 1; } to { opacity: 0; } }

.cs { position: absolute; left: 0; top: 0; }
.cs .lead { position: absolute; left: 0; top: 0; width: 20px; height: 1.5px; background: var(--glow-hi); transform-origin: 0 50%; transform: rotate(-45deg); }
.cs .tag { position: absolute; left: 13px; top: -36px; white-space: nowrap; font: 700 11px/1 var(--mono); padding: 5px 7px; border-radius: 6px; background: var(--panel); color: var(--glow-hi); border: 1px solid var(--glow); box-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
.cs .dot { display: none; position: absolute; left: -10px; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: var(--glow); color: var(--on-glow); font: 800 9px/20px var(--mono); text-align: center; }
.cs.compact .lead, .cs.compact .tag { display: none; }
.cs.compact .dot { display: block; }
.cs.stale .tag { border-color: var(--amber); color: var(--amber); }
.cs.stale .lead, .cs.stale .dot { background: var(--amber); }
.cs-icon.gliding { transition: transform .8s cubic-bezier(.4, 0, .2, 1); }

.jl { position: absolute; left: 0; top: 0; transform: translateY(calc(-100% - 4px - var(--k, 0) * 21px)); white-space: nowrap; font: 600 11px/1 var(--mono); color: var(--job); background: var(--label-bg); padding: 4px 6px; border-radius: 4px; }
.jl .c { color: var(--muted); margin-left: 4px; }
.jl.active { color: var(--text); }
.donut { position: absolute; left: -24px; top: -24px; width: 48px; height: 48px; border-radius: 50%; box-shadow: 0 2px 12px rgba(0, 0, 0, .4); }
.donut::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--panel); }
.donut span { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; font: 700 10px var(--mono); }
.donut b { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 11px var(--mono); color: var(--job); background: var(--label-bg); padding: 2px 5px; border-radius: 4px; }
.far .leaflet-tiles-pane, .far .leaflet-glow-pane, .far .leaflet-deco-pane, .far .leaflet-flash-pane, .far .leaflet-callsign-pane, .far .leaflet-labels-pane { display: none; }
.leaflet-donut-pane { display: none; }
.far .leaflet-donut-pane { display: block; }

/* phone and tablet: map on top, bottom sheet with tabs */
@media (max-width: 1023px) {
  body { display: block; height: auto; overflow: auto; }
  main { display: block; }
  #map { height: 50vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; margin-top: -16px; position: relative; z-index: 500; min-height: 50vh; overflow: visible; }
  .tabs { display: flex; position: sticky; top: 0; z-index: 1; gap: 4px; padding: 10px 0 8px; background: var(--panel); }
  .tabs::before { content: ""; position: absolute; top: 4px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--text); }
  .tabs .n { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border-radius: 9px; background: var(--line); font-size: 11px; }
  .tabs .n.hot { background: var(--bad); color: #fff; }
  aside section[data-tab] { display: none; }
  aside[data-tab="alarms"] [data-tab="alarms"], aside[data-tab="workers"] [data-tab="workers"], aside[data-tab="jobs"] [data-tab="jobs"] { display: block; }
  aside.has-detail section[data-tab] { display: none !important; }
  aside section h2 { display: none; }
  .legend { max-width: 170px; gap: 2px 8px; padding: 5px 7px; font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <span class="brand">OXO</span>
  <span id="db" class="db" title="Datenbank erreichbar"></span>
  <span id="sum"></span>
  <span id="ago" class="ago"></span>
  <span class="spacer"></span>
  <button id="scale" class="toggle" aria-pressed="false">Demo: 500 Tiles / 10 Worker</button>
  <span class="mock" title="Simulierte Daten, Zeitraffer 30×">MOCKUP · Demo-Daten · 30×</span>
</header>
<main>
  <div id="map" role="region" aria-label="Karte der Tiles"></div>
  <aside id="side" data-tab="alarms">
    <nav class="tabs" role="tablist">
      <button role="tab" data-go="alarms">Alarme<span class="n" id="n-alarms"></span></button>
      <button role="tab" data-go="workers">Worker<span class="n" id="n-workers"></span></button>
      <button role="tab" data-go="jobs">Jobs<span class="n" id="n-jobs"></span></button>
    </nav>
    <section id="detail" hidden>
      <div class="dhead"><span id="d-sw" class="sw"></span><b id="d-tile"></b><button class="x" id="d-x" aria-label="Detail schließen">×</button></div>
      <div id="d-body"></div>
    </section>
    <section data-tab="alarms"><h2>Alarme</h2><ul id="alarms"></ul><p class="empty" id="no-alarms">Keine Alarme — alles ruhig.</p></section>
    <section data-tab="workers"><h2>Worker</h2><ul id="workers"></ul></section>
    <section data-tab="jobs"><h2>Jobs</h2><ul id="jobs"></ul><p class="pkg" id="pkg"></p></section>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

function tilePx(b) {
  const a = map.latLngToLayerPoint(L.latLng(b[1][0], b[0][1])), c = map.latLngToLayerPoint(L.latLng(b[0][0], b[1][1]));

// ---------------------------------------------------------------------------
// Render state: caches keyed by tile, job id and worker name
// ---------------------------------------------------------------------------
const R = new Map();      // tile -> { rect (canvas), glow (svg), deco (marker), e, k, wk, stale }
const J = new Map();      // job id -> { outline, label, donut }
const CS = new Map();     // worker name -> callsign marker
const hidden = new Set(); // job ids hidden by the filter chip
let cur = null, sel = null, firstRender = true;

function derive(s) {
  const tiles = new Map(), byTask = new Map();
  for (const job of s.jobs) {
    if (hidden.has(job.id)) continue;
    for (const task of job.tasks) {
      const b = tileBounds(task.tile);
      if (!b) continue;
      let e = tiles.get(task.tile);
      if (!e) tiles.set(task.tile, e = { b, entries: [] });
      e.entries.push({ job, task });
    }
  }
  for (const e of tiles.values()) e.win = e.entries.reduce((a, x) => PRIO[x.task.state] > PRIO[a.task.state] ? x : a);
  s.workers.forEach((w, i) => { if (w.current) byTask.set(w.current.task_id, { w, i }); });
  return { tiles, byTask };
}

  const d = derive(s), gen = ms(s.generated_at), now = nowMs();

    renderCallsigns(s, d, gen);

    if (firstRender) { fitStart(s); firstRender = false; }
  }

}

function renderTiles(d, gen, now) {

    if (!o) {

      o.rect.on("click", () => select(key));

    }
    o.e = e;
    o.k = kind(e.win.task);
    o.wk = d.byTask.get(e.win.task.id);
    const hb = e.win.task.last_heartbeat_at;
    o.stale = o.k === "claimed" && !!hb && gen - ms(hb) > STALE_MS;
    restyle(o);
    if (o.k === "claimed") {
      if (!o.glow) {
        o.glow = L.rectangle(o.b, { renderer: glowR, className: "glow" }).addTo(map);
        o.glow.on("click", () => select(key));
        o.glow.bindTooltip(() => tipEl(key), { sticky: true });
      }
      o.glow.getElement().classList.toggle("stale", o.stale);
    } else if (o.glow) { o.glow.remove(); o.glow = null; }
    updateDeco(o, now);
  }

// Deco marker on a tile: step ring, ping/ripple waves, badges.
function makeDeco(o) {

  const ping = h("div", "wave ping"), rip = h("div", "wave rip");
  const svg = document.createElementNS(NS, "svg");

  svg.append(txt);
  const badge = h("span", "badge"), neu = h("span", "neu"), raw = h("span", "raw");
  root.append(ping, rip, svg, raw, badge, neu);
  o.deco = { root, ping, rip, trk, fil, prog, txt, badge, neu, raw, idx: -1, m: pinMarker(center(o.b), "deco", root, "deco-icon") };

}

  D.root.classList.toggle("claimed", claimed);
  D.root.classList.toggle("stale", o.stale);

  D.neu.textContent = isNew ? "neu" : "";
  D.idx = claimed && o.wk ? stepIdx(o.wk.w.current.step) : -1;
  D.fil.forEach((p, i) => p.classList.toggle("done", i < D.idx));
  D.trk.forEach((p, i) => p.classList.toggle("act", i === D.idx));
  D.txt.textContent = D.idx >= 0 ? "S" + STEPS[D.idx] : claimed ? "?" : "";

// ---------------------------------------------------------------------------
// Motion, all derived from the diff prev -> next
// ---------------------------------------------------------------------------
function wave(o, which, dur, from) {

  o.deco[which].animate([{ transform: `scale(${from})`, opacity: 1 }, { transform: "scale(1)", opacity: 0 }], { duration: dur, easing: "cubic-bezier(.2,.6,.3,1)" });
}
function flash(o, cls, delay, dur, sup) {
  if (reduced()) { markNew(o); return; }
  const el = h("div", "flash " + cls);
  if (cls === "cool") el.append(h("span", "check", "✓"));
  el.style.animationDelay = delay + "ms";
  const m = pinMarker(center(o.b), "flash", el, "flash-icon");
  sizeIcon(m, ...tilePx(o.b));
  if (sup) {
    o.sup = performance.now() + sup;
    restyle(o);
    setTimeout(() => { if (R.get(o.key) === o) restyle(o); }, sup + 30);
  }

}
function markNew(o) {

  o.newUntil = performance.now() + 60e3;

function motion(s, prev) {
  const pt = new Map();
  prev.jobs.forEach(j => j.tasks.forEach(t => pt.set(t.id, t)));
  for (const job of s.jobs) for (const task of job.tasks) {
    const p = pt.get(task.id), o = R.get(task.tile);
    if (!p || !o) continue;
    if (p.state !== "claimed" && task.state === "claimed") { wave(o, "ping", 600, .05); markNew(o); }
    else if (task.state === "claimed" && p.last_heartbeat_at !== task.last_heartbeat_at && !o.stale) wave(o, "rip", 1400, .3);
    if (p.state === "claimed" && task.state === "succeeded" && o.k === "succeeded") flash(o, "cool", 0, 1200, 1200);
    if (p.state === "claimed" && task.state === "pending") flash(o, "shake", 0, 300, 300);
    if (p.state !== "abandoned" && task.state === "abandoned") markNew(o);
  }
  // step advanced on the same task: sweep the finished segment(s)
  const pw = new Map(prev.workers.map(w => [w.name, w]));
  for (const w of s.workers) {
    const p = pw.get(w.name);
    if (!w.current || !p || !p.current || p.current.task_id !== w.current.task_id) continue;
    const a = stepIdx(p.current.step), b = stepIdx(w.current.step), o = R.get(w.current.tile);
    if (o && o.deco && !reduced() && b > a) for (let i = Math.max(0, a); i < b; i++)
      o.deco.fil[i].animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 600, easing: "ease-out" });
  }

  const seen = new Set(prev.installs.map(i => i.at + i.code));
  for (const ins of s.installs) {
    if (seen.has(ins.at + ins.code)) continue;
    const step = Math.min(80, 1500 / ins.tiles.length);
    ins.tiles.forEach((t, i) => { const o = R.get(t); if (o) flash(o, "contour", i * step, 1400, 0); });
  }
}

// ---------------------------------------------------------------------------
// Jobs: dashed outline, label, donut (zoom < 5)
// ---------------------------------------------------------------------------
function renderJobs(s, first) {

    const bb = bbox(job.tasks);
    if (hidden.has(job.id) || !bb) continue;
    live.add(job.id);
    const ck = bb.join(), k = corner.get(ck) || 0;
    corner.set(ck, k + 1);
    const p = .05 * k, pb = [[bb[0][0] + p, bb[0][1] + p], [bb[1][0] - p, bb[1][1] - p]];

      o.outline = L.rectangle(pb, { renderer: jobR, className: "job-outline", dashArray: "6 5", weight: 1.5, fill: false, interactive: false }).addTo(map);
      o.label = pinMarker([bb[1][0], bb[0][1]], "labels", o.lab, "label-icon");
      o.donut = pinMarker(center(bb), "donut", o.don, "donut-icon");

      o.outline.setBounds(pb);
      o.label.setLatLng([bb[1][0], bb[0][1]]);

// ---------------------------------------------------------------------------
// Demo simulator (not part of the real frontend)
// ---------------------------------------------------------------------------
const SIM_DT = 90e3, STEP_TICKS = [3, 3, 1, 3];
const STEP_TXT = ["Step 1 : Building vector data for tile ", "Step 2 : Building mesh for tile ", "Step 2.5 : Building masks for tile ", "Step 3 : Building DSF/imagery for tile "];
const LOGS = [
  ["-> Downloading OSM data for rel[\"natural\"=\"water\"]", "   Number of edges at this point: 124650", "-> Dealing with inland water", "-> Treating airports"],
  ["-> Triangulating with Triangle4XP", "   Min angle 10.0, max area 0.0003", "-> Smoothing elevation", "   Number of triangles: 1874211"],
  ["-> Building masks, blur 0.5", "   Mask zl14 34720_22656 done"],
  ["-> Downloading imagery zl17: 412/1024 jpegs", "-> Building DSF", "-> DSFTool: compiling", "   Converting textures to DDS"]
];

let simId = 0;
const tileName = (la, lo) => (la < 0 ? "-" : "+") + String(Math.abs(la)).padStart(2, "0") + (lo < 0 ? "-" : "+") + String(Math.abs(lo)).padStart(3, "0");
function newJob(code, tiles, now) {
  return {
    id: "sim-job-" + (++simId), region_code: code, revision: 1, package: "oxo_" + code.toLowerCase().replace(/-/g, "_"),
    created_at: iso(now), max_attempts: 3, state: "pending", counts: { pending: tiles.length, claimed: 0, succeeded: 0, abandoned: 0 }, total: tiles.length,
    tasks: tiles.map(tile => ({ id: "sim-task-" + (++simId), tile, task_type: "ortho", state: "pending", attempts: 0, claimed_by: null, claimed_at: null, last_heartbeat_at: null, last_failure: null, replaces: null, patches: [] }))
  };
}
function makeSim(state, scale) {
  const sim = { s: state, tick: 0, steps: new Map(), nb: new Map(), lastSpawn: 0, spawnN: 0, scale, rnd: rng(scale ? 7 : 3) };
  for (const w of state.workers) if (w.current) sim.steps.set(w.name, { idx: Math.max(0, stepIdx(w.current.step)), left: 2 });
  return sim;
}
function claim(sim, s, w, now) {
  const jobs = [...s.jobs].sort((a, b) => a.created_at < b.created_at ? -1 : 1);
  for (const j of jobs) for (const t of j.tasks) {
    if (t.state !== "pending" || (sim.nb.get(t.id) || 0) > sim.tick) continue;
    Object.assign(t, { state: "claimed", attempts: t.attempts + 1, claimed_by: w.name.replace(/-worker$/, ""), claimed_at: iso(now), last_heartbeat_at: iso(now) });
    w.current = { task_id: t.id, tile: t.tile, task_type: t.task_type, attempt: t.attempts, since: iso(now), step: STEP_TXT[0] + t.tile, step_since: iso(now) };
    w.log_tail = [{ at: iso(now), line: `-> claimed ${t.tile}, attempt ${t.attempts}` }];
    sim.steps.set(w.name, { idx: 0, left: STEP_TICKS[0] });
    return;
  }
}
function release(sim, t, j, w, msg) {
  Object.assign(t, { claimed_by: null, claimed_at: null, last_heartbeat_at: null });
  if (msg) {
    t.last_failure = msg;
    if (t.attempts >= j.max_attempts) t.state = "abandoned";
    else { t.state = "pending"; sim.nb.set(t.id, sim.tick + 3); }
  } else t.state = "succeeded";

}
function recount(j) {
  const c = { pending: 0, claimed: 0, succeeded: 0, abandoned: 0 };
  j.tasks.forEach(t => c[t.state]++);
  j.counts = c; j.total = j.tasks.length;
  j.state = c.pending + c.claimed ? (c.claimed + c.succeeded + c.abandoned ? "in_progress" : "pending") : c.abandoned ? "failed" : "complete";
}
function advance(sim) {
  const s = structuredClone(sim.s), T = ++sim.tick, rnd = sim.rnd;
  const now = ms(s.generated_at) + SIM_DT;
  s.generated_at = iso(now);
  const tasks = new Map();
  s.jobs.forEach(j => j.tasks.forEach(t => tasks.set(t.id, { t, j })));
  if (!sim.scale && T === 3) { s.jobs.push(newJob("BAYERN-RAND", ["+47+010", "+47+011", "+47+012", "+49+010", "+49+011", "+49+012"], now)); sim.lastSpawn = T; }

  s.workers.forEach((w, i) => {
    if (!sim.scale && i === 0 && T >= 20 && T < 24) return;           // stale phase: no heartbeat, no progress
    if (w.current) {
      const { t, j } = tasks.get(w.current.task_id), st = sim.steps.get(w.name);
      t.last_heartbeat_at = iso(now - (3 + rnd() * 20) * 1000);
      if (!sim.scale && T === 14) release(sim, t, j, w, "build_mesh: Triangle4XP exited with code 1 (Crash!)");
      else if (--st.left > 0) {
        const pool = LOGS[st.idx];
        w.log_tail = [...w.log_tail, { at: iso(now), line: pool[Math.floor(rnd() * pool.length)] }].slice(-3);
      } else if (st.idx < 3) {
        st.idx++; st.left = STEP_TICKS[st.idx] + (rnd() < .4 ? 1 : 0);
        w.current = { ...w.current, step: STEP_TXT[st.idx] + t.tile, step_since: iso(now - rnd() * 20e3) };
        w.log_tail = [...w.log_tail, { at: iso(now), line: w.current.step }].slice(-3);
      } else release(sim, t, j, w, sim.scale && rnd() < .06 ? "build_tile: DSFTool failed: out of disk space on scratch" : null);
    }
    if (!w.current) claim(sim, s, w, now);
  });

  for (const j of s.jobs) {
    const was = j.state;
    recount(j);
    if (was !== "complete" && j.state === "complete") {
      const name = `zzXEL_${j.package}_ortho`, code = j.package === "oxo_apt" ? "A00_OXO" : "A4_" + j.region_code.replace(/^(OXO|EU)-/, "").split("-")[0];
      const tiles = j.tasks.map(t => t.tile);
      s.installs.push({ at: iso(now), code, package: name, tiles });
      const p = s.packages.find(x => x.name === name);
      if (p) p.tiles = tiles.length; else s.packages.push({ name, code, version: "99.99.99", tiles: tiles.length, owner: "oxo" });
    }
  }
  const busy = s.jobs.some(j => j.counts.pending + j.counts.claimed > 0);
  if (!sim.scale && !busy && T - sim.lastSpawn > 4) {
    const names = ["ALPEN-NORD", "RHEIN", "ELBE", "DONAU", "MOSEL", "ODER"];
    const la = 45 + Math.floor(rnd() * 7), lo = 4 + Math.floor(rnd() * 12), tiles = [];
    for (let a = 0; a < 2; a++) for (let b = 0; b < 3; b++) tiles.push(tileName(la + a, lo + b));
    s.jobs.push(newJob(names[sim.spawnN++ % names.length], tiles, now));
    sim.lastSpawn = T;
  }
  sim.s = s;
  return s;
}
// 500 tiles, 10 workers: a 20 x 25 region over central Europe in four jobs.
function scaleState() {
  const rnd = rng(11), now = ms(SAMPLE.generated_at);
  const quads = [["MEU-NW", 53, 63, 0, 12, .92], ["MEU-SW", 43, 53, 0, 12, .6], ["MEU-SO", 43, 53, 12, 25, .3], ["MEU-NO", 53, 63, 12, 25, .04]];
  const jobs = quads.map(([code, la0, la1, lo0, lo1, done], qi) => {
    const tiles = [];
    for (let lo = lo0; lo < lo1; lo++) for (let la = la0; la < la1; la++) tiles.push(tileName(la, lo));
    const j = newJob(code, tiles, now - (4 - qi) * 3600e3);
    j.tasks.forEach((t, k) => {
      if (k < done * tiles.length) Object.assign(t, { state: rnd() < .015 ? "abandoned" : "succeeded", attempts: 1 });
      if (t.state === "abandoned") t.last_failure = "build_mesh: Triangle4XP exited with code 1 (Crash!)";
      else if (t.state === "pending" && rnd() < .03) Object.assign(t, { attempts: 1, last_failure: "prepare: download of DEM tile timed out" });
    });

  });
  const s = { generated_at: SAMPLE.generated_at, database: { reachable: true, error: null }, jobs, workers: [], packages: SAMPLE.packages.slice(), installs: SAMPLE.installs.slice() };
  for (let i = 1; i <= 10; i++) s.workers.push({ name: `oxo-worker-${i}-worker`, state: "running", started_at: iso(now - 3600e3), current: null, log_tail: [] });
  const sim = makeSim(s, true);
  sim.s = s;
  for (const w of s.workers) {
    claim(sim, s, w, now - rnd() * 900e3);
    const idx = Math.floor(rnd() * 4), st = sim.steps.get(w.name);
    st.idx = idx; st.left = 1 + Math.floor(rnd() * 3);
    w.current.step = STEP_TXT[idx] + w.current.tile;
    w.current.step_since = iso(now - rnd() * 300e3);
  }
  s.jobs.forEach(recount);
  return sim;
}

function resetMap() {
  for (const o of R.values()) { o.rect.remove(); if (o.glow) o.glow.remove(); if (o.deco) o.deco.m.remove(); }
  for (const o of J.values()) { o.outline.remove(); o.label.remove(); o.donut.remove(); }
  for (const o of CS.values()) o.m.remove();
  R.clear(); J.clear(); CS.clear(); hidden.clear();
  for (const id of ["alarms", "workers", "jobs"]) { $("#" + id).replaceChildren(); $("#" + id)._m = null; }
  cur = null; sel = null; firstRender = true;
}

let sim = makeSim(structuredClone(SAMPLE), false);
receive(sim.s);
setInterval(() => receive(advance(sim)), 3000);
$("#scale").addEventListener("click", ev => {
  const on = ev.currentTarget.getAttribute("aria-pressed") !== "true";
  ev.currentTarget.setAttribute("aria-pressed", String(on));
  resetMap();
  sim = on ? scaleState() : makeSim(structuredClone(SAMPLE), false);
  receive(sim.s);
});
</script>
</body>
</html>
