# House profile for own XEarthLayer ortho packages. Copy to ops/specs/<package>.toml,
# set tiles, metadata and target.root; keep the parameters unless a package needs
# a variant (e.g. masking_mode = "sand"), which is then its own spec.
# Values mirror the legacy Ortho4XP production (docs/plans/2026-10-23-own-package-production.md).
tiles = ["+48+010", "+48+011", "+48+012"]

[metadata]
name = "example"          # becomes zzXEL_<name>_ortho
region_code = "EU"
revision = 1

[parameters]
provider = "BI"           # oxo-package requires BI (.ter must reference _BI<zl>.dds)
zoom = 17
include_overlays = false  # own packages never carry overlays
skip_converts = true      # XEL streams the imagery; no jpgs/DDS in the deliverable

[parameters.raw]
mesh_zl = "19"
curvature_tol = "2.0"
min_angle = "10.0"
cover_airports_with_highres = "ICAO"
cover_zl = "18"
cover_extent = "6.0"
masking_mode = "rocks"
mask_zl = "16"
water_tech = "XP12"
road_level = "3"
fill_nodata = "True"

[target]
root = "/mnt/xplane_data/oxo/artifacts/example"   # same path inside the pod (ops/worker-pod.yaml)

[failure_policy]
max_attempts = 3
backoff_seconds = 60
